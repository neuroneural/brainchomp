name: Build and Deploy

on:
  push:
    branches:
      - webgpu
  schedule:
    # Refresh the baked GitHub star count daily.
    - cron: '23 4 * * *'
  workflow_dispatch:

jobs:
  build-and-publish-live-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch current GitHub star count for static fallback
        id: stars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STARS=$(gh api repos/neuroneural/brainchomp --jq '.stargazers_count' 2>/dev/null || echo 2)
          if ! [[ "$STARS" =~ ^[0-9]+$ ]]; then
            STARS=2
          fi
          echo "count=$STARS" >> "$GITHUB_OUTPUT"

      - name: Install and Build
        env:
          BRAINCHOMP_GH_STARS: ${{ steps.stars.outputs.count }}
        run: |
          npm ci
          npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: demo
          folder: dist
